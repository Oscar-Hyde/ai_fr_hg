name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Upstream identifies develop as 17.0.0-dev. There is no stable version-17
  # branch yet, so the quality gate uses an immutable audited revision.
  FRAPPE_BRANCH: develop
  FRAPPE_SHA: d7000da3d5862087d3df08e009fe76518ea649c4

jobs:
  tests:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "Yes"
      DB_ROOT_PASSWORD: root

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=12

    steps:
      - name: Clone application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          check-latest: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client

      - name: Initialize pinned Frappe v17 bench
        run: |
          python -m pip install --upgrade pip frappe-bench
          bench init \
            --skip-redis-config-generation \
            --skip-assets \
            --frappe-branch "$FRAPPE_BRANCH" \
            --python "$(command -v python)" \
            /home/runner/frappe-bench
          # Bench clones Frappe with its canonical remote name, `upstream`.
          git -C /home/runner/frappe-bench/apps/frappe fetch --depth 1 upstream "$FRAPPE_SHA"
          git -C /home/runner/frappe-bench/apps/frappe checkout --detach "$FRAPPE_SHA"
          test "$(git -C /home/runner/frappe-bench/apps/frappe rev-parse HEAD)" = "$FRAPPE_SHA"

      - name: Install application and migrate
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app ai_fr_hg "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site \
            --db-type mariadb \
            --db-root-password "$DB_ROOT_PASSWORD" \
            --admin-password admin \
            test_site
          bench --site test_site install-app ai_fr_hg
          bench --site test_site migrate
          bench build --app ai_fr_hg
          env/bin/python -c 'import frappe; assert frappe.__version__ == "17.0.0-dev", frappe.__version__'

      - name: Run server tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app ai_fr_hg
        env:
          TYPE: server
