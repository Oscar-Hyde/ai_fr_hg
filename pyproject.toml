[project]
name = "ai_fr_hg"
authors = [
    { name = "Ai Fr Hg", email = "oscarhyde2002@outlook.com"}
]
description = "A technical-beta, local-first AI application targeting Frappe v17"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Frappe 17.0.0-dev is installed and pinned by Bench/CI, not pip metadata.
    # The core platform depends only on `requests`, which Frappe already provides.
    # Everything else is optional and degrades gracefully - see [project.optional-dependencies].
]

[project.optional-dependencies]
# Document format support. Install with:
#   bench pip install --editable "./apps/ai_fr_hg[documents]"
documents = [
    "pypdf>=4.0",           # PDF
    "python-docx>=1.1",     # Word .docx
    "openpyxl>=3.1",        # Excel .xlsx
    "python-pptx>=0.6",     # PowerPoint .pptx
    "odfpy>=1.4",           # OpenDocument .odt / .ods / .odp
    "beautifulsoup4>=4.12", # HTML / XML
    "lxml>=5.0",            # Faster HTML/XML parsing
]

# Optical character recognition fallback for image files only.
# Scanned-PDF OCR is unsupported. Also needs: apt install tesseract-ocr
ocr = [
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
]

# Vectorised similarity ranking. Strongly recommended: it turns retrieval
# scoring into a single matrix multiply instead of a Python loop.
performance = [
    "numpy>=1.26",
]

# Cron expressions for scheduled pipelines.
scheduling = [
    "croniter>=2.0",
]

all = [
    "ai_fr_hg[documents,ocr,performance,scheduling]",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
